services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: techng-lms-api

    restart: unless-stopped

    ports:
      - "${PORT:-3001}:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - techng-lms

networks:
  techng-lms:
    driver: bridge